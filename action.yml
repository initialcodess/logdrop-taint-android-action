name: "LogDrop Taint (Android)"
description: "Taint (data-flow) analysis for Android/Kotlin source. Your source never leaves the runner; only SARIF is produced."
author: "Initial Code Software Solutions"

branding:
  icon: shield
  color: green

inputs:
  license:
    description: "Your LogDrop licence key. Keep it in a repository secret. It is verified offline; no data is sent anywhere."
    required: true
  path:
    description: "The directory to scan, relative to the repository root."
    required: false
    default: "."
  repo-root:
    description: "The root that SARIF paths are relative to. Code Scanning can bind a finding to a file only through a repo-root path."
    required: false
    default: ${{ github.workspace }}
  sarif-file:
    description: "Path of the SARIF file to write."
    required: false
    default: "logdrop-taint.sarif"
  fail-on-findings:
    description: "Fail the step when there are findings. Use it as a CI gate."
    required: false
    default: "false"
  annotations:
    description: "Show findings as a box above the line in the pull request. Free; no Code Scanning licence needed."
    required: false
    default: "true"
  upload-sarif:
    description: "Upload the SARIF to Code Scanning. If Code Scanning is off on your repository the step warns and moves on rather than breaking the build."
    required: false
    default: "true"
  include-tests:
    description: "Scan test code too. Test fixtures are where fake credentials live, so they are skipped by default."
    required: false
    default: "false"
  leaks:
    description: "Look for memory and resource leaks (CWE-401): a screen held in static storage, and a delayed callback that outlives what posted it. On by default. Set false to turn the analysis off entirely — it will not run and its rules will not appear in the report."
    required: false
    default: "true"
  snippets:
    description: "Include the offending line and ±2 lines of context in the report (on by default). Set to 'false' and the report carries only the rule and file:line — not a fragment of your code leaves."
    required: false
    default: "true"
  panel-url:
    description: "The panel address, if reports should be sent to the LogDrop panel. LEFT EMPTY, nothing is sent (the default). The only thing sent is the SARIF, never your source."
    required: false
    default: ""
  bundle-id:
    description: "The application id (e.g. com.company.app). Required when panel-url is set — the panel merges reports into one app under it."
    required: false
    default: ""
  analyzer-version:
    description: "Which analyzer version to download. The default is the one tested with this action release — you should not need to change it."
    required: false
    default: "v0.10.0"

outputs:
  sarif-file:
    description: "Path of the SARIF file that was written."
    value: ${{ inputs.sarif-file }}
  findings:
    description: "How many findings were reported."
    value: ${{ steps.scan.outputs.findings }}
  report-id:
    description: "Identifier of the report the panel stored. Empty when no panel-url was given, or when the send failed."
    value: ${{ steps.panel.outputs.report-id }}

runs:
  using: composite
  steps:
    # UBUNTU, not macOS. The iOS analyzer links against Apple frameworks and has no
    # choice; this one is a JVM program, and a Linux runner costs a tenth as much.
    # Nothing here requires the Android SDK either — only the source is read.
    - name: Download the analyzer
      shell: bash
      env:
        VERSION: ${{ inputs.analyzer-version }}
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/install.sh" \
          "https://raw.githubusercontent.com/initialcodess/logdrop-taint-android-action/${VERSION}/examples/install-logdrop-taint.sh"
        chmod +x "$RUNNER_TEMP/install.sh"
        LOGDROP_VERSION="$VERSION" LOGDROP_DIR="$RUNNER_TEMP/logdrop" "$RUNNER_TEMP/install.sh"

    - name: Scan
      id: scan
      shell: bash
      env:
        LOGDROP_LICENSE: ${{ inputs.license }}
        SCAN_PATH: ${{ inputs.path }}
        REPO_ROOT: ${{ inputs.repo-root }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        FAIL_ON: ${{ inputs.fail-on-findings }}
        ANNOTATE: ${{ inputs.annotations }}
        INCLUDE_TESTS: ${{ inputs.include-tests }}
        LEAKS: ${{ inputs.leaks }}
        SNIPPETS: ${{ inputs.snippets }}
        VERSION: ${{ inputs.analyzer-version }}
      run: |
        set -uo pipefail
        jar="$RUNNER_TEMP/logdrop/logdrop-taint-android-${VERSION}.jar"
        args=("$SCAN_PATH" --sarif "$SARIF_FILE" --repo-root "$REPO_ROOT")
        [ "$ANNOTATE" = "true" ] && args+=(--github-annotations)
        [ "$INCLUDE_TESTS" = "true" ] && args+=(--include-tests)
        # BOTH directions, because the analyzer's own default is now on. Passing only
        # --leaks would leave `leaks: false` doing nothing at all, which is worse than
        # not offering the input: the customer would have turned it off and still see
        # the findings.
        if [ "$LEAKS" = "false" ]; then args+=(--no-leaks); else args+=(--leaks); fi
        [ "$SNIPPETS" = "false" ] && args+=(--no-snippets)
        [ "$FAIL_ON" = "true" ] && args+=(--fail-on-findings)

        java -jar "$jar" "${args[@]}"
        code=$?

        # The count is read from the SARIF rather than scraped from the output: a
        # message people improve is a message that silently changes shape.
        findings=$(python3 -c "import json;print(len(json.load(open('$SARIF_FILE'))['runs'][0]['results']))" 2>/dev/null || echo 0)
        echo "findings=$findings" >> "$GITHUB_OUTPUT"

        {
          echo "## LogDrop Taint (Android)"
          echo ""
          if [ "$findings" -eq 0 ]; then
            echo "No findings."
          else
            echo "| Rule | File | Line |"
            echo "|---|---|---|"
            python3 -c "
        import json
        for r in json.load(open('$SARIF_FILE'))['runs'][0]['results']:
            loc = r['locations'][0]['physicalLocation']
            print('| ' + r['ruleId'] + ' | ' + loc['artifactLocation']['uri'] + ' | ' + str(loc['region']['startLine']) + ' |')
        "
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        # Exit codes are passed through unchanged: 1 findings, 2 licence, 3 config.
        # Collapsing them would tell a developer whose licence lapsed that their code
        # has a vulnerability.
        exit $code

    - name: Upload to Code Scanning
      if: ${{ inputs.upload-sarif == 'true' && always() }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}

    # The POST is written out here rather than fetched. It used to download
    # examples/report-to-panel.sh from this repository at ${VERSION} — and VERSION was
    # `github.ref_name`, the CUSTOMER'S branch. On `main` that happened to resolve
    # because this repository also has a `main`; on any other branch, and on every
    # release tag, the URL 404s, `curl -fsSL` fails, and the customer's build goes red
    # for a reason that has nothing to do with their code. Reporting to the panel must
    # never do that, which the script itself says in its own header.
    #
    # The script stays where it is: it is what the CircleCI, GitLab, Jenkins, Bitrise
    # and Gradle recipes run, and it is the twin of the iOS copy. Only the GitHub path
    # stopped fetching it, which is also what the iOS action does.
    - name: Send the report to the panel
      id: panel
      if: ${{ always() && inputs.panel-url != '' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PANEL_URL: ${{ inputs.panel-url }}
        BUNDLE_ID: ${{ inputs.bundle-id }}
        LICENSE: ${{ inputs.license }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        APP_NAME: ${{ github.event.repository.name }}
        COMMIT: ${{ github.sha }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -uo pipefail
        if [ -z "$BUNDLE_ID" ]; then
          echo "::error title=bundle-id missing::panel-url was given but bundle-id was not. The panel uses bundle-id to decide which application a report belongs to."
          exit 1
        fi
        if [ ! -f "$SARIF_FILE" ]; then
          echo "::warning title=Panel report not sent::No report at '$SARIF_FILE' — the scan wrote nothing to send."
          exit 0
        fi

        url="${PANEL_URL%/}/api/reports/sarif"
        body="$RUNNER_TEMP/panel-response.txt"

        # NO `|| echo 000`: when curl cannot connect, -w already prints "000"; combining
        # the two yields "000000" and the "panel unreachable" branch never matches.
        code=$(curl -sS -o "$body" -w '%{http_code}' -X POST "$url" \
          -H "Authorization: Bearer $LICENSE" \
          -F "sarif=@$SARIF_FILE" \
          -F "bundle_id=$BUNDLE_ID" \
          -F "app_name=$APP_NAME" \
          -F "version=$REF_NAME" \
          -F "commit=$COMMIT")
        code=${code:-000}

        # Sending to the panel does NOT break the build. The scan succeeded and finding
        # reporting already ran; a pull request turning red while the panel is under
        # maintenance would be a fault charged to us. Nor does it pass silently.
        case "$code" in
          200|201)
            # The id the panel filed the report under. Printing "sent" and nothing else
            # leaves no way to reach the report — a customer cannot search the tenant's
            # report list, and we have had to look one up by hand three times.
            # `sed` rather than `jq` or `python3`: neither is guaranteed on a customer's
            # runner, and this must not be the line that fails.
            report_id=$(sed -n 's/.*"report_id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$body" | head -1)
            if [ -n "$report_id" ]; then
              echo "report-id=$report_id" >> "$GITHUB_OUTPUT"
              echo "::notice title=LogDrop panel::Report $report_id was stored by the panel."
              echo "LogDrop panel report: \`$report_id\`" >> "$GITHUB_STEP_SUMMARY"
            else
              # Accepted, but we cannot say what was stored. Not a build failure, and
              # not silent either — "sent" with no id reads as success and is not.
              echo "::warning title=Panel report id missing::The panel accepted the report but returned no id: $(head -c 300 "$body")"
            fi
            ;;
          401)
            echo "::warning title=Panel report not sent::The panel refused the licence key (401). Check the key."
            ;;
          403)
            # A 403 can carry two causes: expired OR revoked. Saying "renew it" would be
            # misleading for a revocation, so the panel's own explanation is shown.
            echo "::warning title=Panel report not sent::The panel refused the licence (403): $(head -c 300 "$body") — it may be expired or revoked. satis@initialcode.io"
            ;;
          400|422)
            echo "::warning title=Panel report not sent::The panel rejected the request ($code). Check bundle-id and the SARIF file: $(head -c 300 "$body")"
            ;;
          413)
            echo "::warning title=Panel report not sent::The SARIF exceeded the panel size limit (413). Try narrowing the scan: use exclude in .logdrop.json to drop generated code."
            ;;
          503)
            echo "::warning title=Panel report not sent::The panel is currently unavailable (503). The scan was unaffected; the next run will try again."
            ;;
          000)
            echo "::warning title=Panel report not sent::The panel could not be reached ($PANEL_URL). The scan was unaffected."
            ;;
          *)
            echo "::warning title=Panel report not sent::The panel returned $code: $(head -c 300 "$body")"
            ;;
        esac
