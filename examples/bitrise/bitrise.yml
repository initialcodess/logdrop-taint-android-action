# LogDrop Taint (Android) on Bitrise. A linux/android stack already has a JDK.
workflows:
  security-scan:
    envs:
      - LOGDROP_VERSION: v1.0.2
      # Pinned to a COMMIT, not a tag — see examples/README.md.
      - LOGDROP_ACTION_SHA: 77f8b4934122e483489d76466c33d80a92e7fa8f
    steps:
      - activate-ssh-key: {}
      - git-clone: {}
      - script:
          title: Install LogDrop Taint
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                curl -fsSL -o install.sh \
                  "https://raw.githubusercontent.com/initialcodess/logdrop-taint-android-action/$LOGDROP_ACTION_SHA/examples/install-logdrop-taint.sh"
                chmod +x install.sh
                LOGDROP_DIR="$BITRISE_SOURCE_DIR/.logdrop" ./install.sh
      - script:
          title: Scan
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                java -jar "$BITRISE_SOURCE_DIR/.logdrop/logdrop-taint-android-$LOGDROP_VERSION.jar" app/src \
                  --sarif logdrop-taint.sarif --repo-root "$BITRISE_SOURCE_DIR" \
                  --verbose --fail-on-findings
      - script:
          title: Report to the panel
          is_always_run: true
          inputs:
            - content: |
                #!/usr/bin/env bash
                curl -fsSL -o report.sh \
                  https://raw.githubusercontent.com/initialcodess/logdrop-taint-android-action/$LOGDROP_ACTION_SHA/examples/report-to-panel.sh
                APP_NAME="$BITRISE_APP_TITLE" VERSION="$BITRISE_GIT_BRANCH" \
                COMMIT="$BITRISE_GIT_COMMIT" bash report.sh logdrop-taint.sarif || true
